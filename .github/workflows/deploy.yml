name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_PHONE: ${{ vars.VITE_PHONE || secrets.VITE_PHONE }}
          VITE_DISPLAY_PHONE: ${{ vars.VITE_DISPLAY_PHONE || secrets.VITE_DISPLAY_PHONE }}
          VITE_EMAIL: ${{ vars.VITE_EMAIL || secrets.VITE_EMAIL }}
          VITE_ADDRESS: ${{ vars.VITE_ADDRESS || secrets.VITE_ADDRESS }}
          VITE_BIT_PHONE: ${{ vars.VITE_BIT_PHONE || secrets.VITE_BIT_PHONE }}
          VITE_BIT_RECIPIENT: ${{ vars.VITE_BIT_RECIPIENT || secrets.VITE_BIT_RECIPIENT }}
          VITE_WHATSAPP_PHONE: ${{ vars.VITE_WHATSAPP_PHONE || secrets.VITE_WHATSAPP_PHONE }}
          VITE_BUSINESS_ID: ${{ vars.VITE_BUSINESS_ID || secrets.VITE_BUSINESS_ID }}
          VITE_BUSINESS_LEGAL_NAME: ${{ vars.VITE_BUSINESS_LEGAL_NAME || secrets.VITE_BUSINESS_LEGAL_NAME }}
          VITE_A11Y_NAME: ${{ vars.VITE_A11Y_NAME || secrets.VITE_A11Y_NAME }}
          VITE_A11Y_PHONE: ${{ vars.VITE_A11Y_PHONE || secrets.VITE_A11Y_PHONE }}
          VITE_A11Y_EMAIL: ${{ vars.VITE_A11Y_EMAIL || secrets.VITE_A11Y_EMAIL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
